<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="美国流通纪念币图鉴与收藏记录">
  <title>US Coins · 美国流通纪念币图鉴</title>
  <link rel="stylesheet" href="css/styles.css?v=20261112d">
</head>
<body>
  <header class="hero">
    <nav class="nav wrap"><a class="brand" href="#top">US<span>COINS</span></a><a href="#catalog">图鉴</a><a class="panorama-link" href="panorama/">全景图</a></nav>
    <div class="hero-copy wrap" id="top">
      <p class="eyebrow">CIRCULATING COMMEMORATIVES</p>
      <h1>美国流通纪念币<br><em>图鉴</em></h1>
      <p>按面值、系列和年份浏览美国流通纪念币，并记录个人收藏状态。</p>
      <div class="stats"><div><strong id="statCoins">0</strong><span>种面型</span></div><div><strong id="statSeries">0</strong><span>个系列</span></div><div><strong id="statOwned">0</strong><span>已收藏</span></div></div>
    </div>
  </header>

  <main class="wrap" id="catalog">
    <section class="toolbar" aria-label="筛选">
      <label class="search"><span>搜索</span><input id="search" type="search" placeholder="州、人物、系列…"></label>
      <label><span>面值</span><select id="denomination"><option value="">全部</option></select></label>
      <label><span>系列</span><select id="series"><option value="">全部</option></select></label>
      <label><span>年份</span><select id="year"><option value="">全部</option></select></label>
      <button id="reset" type="button">重置</button>
    </section>
    <div class="result-line"><span id="resultCount"></span></div>
    <section class="coin-grid" id="coinGrid" aria-live="polite"></section>
    <p class="empty" id="empty" hidden>没有符合条件的币种。</p>

  </main>

  <template id="cardTemplate">
    <article class="coin-card">
      <div class="card-top"><span class="denom"></span><span class="year"></span></div>
      <div class="faces">
        <figure><div class="coin-image"><img class="obverse" alt="" loading="lazy"><span class="fallback">N/A</span></div><figcaption>OBVERSE · 正面</figcaption></figure>
        <figure><div class="coin-image"><img class="reverse" alt="" loading="lazy"><span class="fallback">N/A</span></div><figcaption>REVERSE · 反面</figcaption></figure>
      </div>
      <div class="card-body"><div class="coin-copy"><p class="series-name"></p><h3></h3><p class="name-zh"></p></div><div class="mints"></div></div>
    </article>
  </template>

  <nav class="page-jumps" aria-label="页面快捷导航">
    <button id="jumpTop" type="button" title="返回页首" aria-label="返回页首">↑</button>
    <button id="jumpBottom" type="button" title="前往页尾" aria-label="前往页尾">↓</button>
  </nav>

  <footer class="site-footer" id="siteFooter"><div class="wrap footer-inner"><a class="license-link" rel="license noopener" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans" target="_blank">CC BY-NC-SA 4.0</a><span>Copyright © 2026<span id="copyrightYears"></span> theluojia</span><span>US COINS · 静态图鉴 · 收藏状态保存在当前浏览器</span></div></footer>
  <script src="js/translations.js?v=20261111h"></script>
  <script src="js/data.js?v=20261111h"></script>
  <script src="js/coin-images.js?v=20261112a"></script>
  <script src="js/app.js?v=20261112b"></script>
  <script>
    (function () {
      var currentYear = new Date().getFullYear();
      document.getElementById('copyrightYears').textContent = currentYear > 2026 ? '–' + currentYear : '';
    })();
  </script>
</body>
</html>
