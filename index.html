<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="美国流通纪念币图鉴与收藏记录">
  <meta name="theme-color" content="#193f36">
  <title>US Coins · 美国流通纪念币图鉴</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=20261113a">
</head>
<body>
  <header class="hero">
    <nav class="nav wrap">
      <a class="brand" href="#top">US<span>COINS</span></a>
      <a href="#catalog" data-i18n="catalog">图鉴</a><a class="panorama-link" href="panorama/" data-i18n="panorama">全景图</a>
      <div class="language-switch" role="group" aria-label="语言 / Language">
        <button type="button" data-language="zh" aria-label="切换为中文">CN</button>
        <button type="button" data-language="en" aria-label="Switch to English">EN</button>
      </div>
    </nav>
    <div class="hero-copy wrap" id="top">
      <p class="eyebrow" data-i18n="eyebrow">CIRCULATING COMMEMORATIVES</p>
      <h1 data-i18n-html="heroTitle">美国流通纪念币<br><em>图鉴</em></h1>
      <p data-i18n="heroText">按面值、系列和年份浏览美国流通纪念币，并记录个人收藏状态。</p>
      <div class="stats"><div><strong id="statCoins">0</strong><span data-i18n="coinTypes">种面型</span></div><div><strong id="statSeries">0</strong><span data-i18n="seriesCount">个系列</span></div><div><strong id="statOwned">0</strong><span data-i18n="owned">已收藏</span></div></div>
    </div>
  </header>

  <main class="wrap" id="catalog">
    <section class="toolbar" aria-label="筛选">
      <label class="search"><span data-i18n="search">搜索</span><input id="search" type="search" placeholder="州、人物、系列…"></label>
      <label><span data-i18n="denomination">面值</span><select id="denomination"></select></label>
      <label><span data-i18n="series">系列</span><select id="series"></select></label>
      <label><span data-i18n="year">年份</span><select id="year"></select></label>
      <button id="reset" type="button" data-i18n="reset">重置</button>
    </section>
    <div class="result-line"><span id="resultCount"></span></div>
    <section class="coin-grid" id="coinGrid" aria-live="polite"></section>
    <p class="empty" id="empty" hidden data-i18n="empty">没有符合条件的币种。</p>

  </main>

  <template id="cardTemplate">
    <article class="coin-card">
      <div class="card-top"><div class="card-meta"><span class="denom"></span><span class="series-name"></span><span class="year"></span></div><div class="mints"></div></div>
      <div class="faces">
        <figure><div class="coin-image"><img class="obverse" alt="" loading="lazy"><span class="fallback">N/A</span></div><figcaption class="obverse-caption"></figcaption></figure>
        <figure><div class="coin-image"><img class="reverse" alt="" loading="lazy"><span class="fallback">N/A</span></div><figcaption class="reverse-caption"></figcaption></figure>
      </div>
      <div class="card-body"><h3></h3><p class="description" hidden></p></div>
    </article>
  </template>

  <nav class="page-jumps" aria-label="页面快捷导航">
    <button id="jumpTop" type="button" title="返回页首" aria-label="返回页首">↑</button>
    <button id="jumpBottom" type="button" title="前往页尾" aria-label="前往页尾">↓</button>
  </nav>

  <footer class="site-footer" id="siteFooter"><div class="wrap footer-inner"><a class="license-link" rel="license noopener" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans" target="_blank">CC BY-NC-SA 4.0</a><span>Copyright © 2026<span id="copyrightYears"></span> theluojia</span><span data-i18n="footerNote">US COINS · 静态图鉴 · 收藏状态保存在当前浏览器</span></div></footer>
  <script src="js/translations.js?v=20261113a"></script>
  <script src="js/data.js?v=20261111h"></script>
  <script src="js/coin-images.js?v=20261112f"></script>
  <script src="js/descriptions.js?v=20261113a"></script>
  <script src="js/app.js?v=20261113a"></script>
  <script>
    (function () {
      var currentYear = new Date().getFullYear();
      document.getElementById('copyrightYears').textContent = currentYear > 2026 ? '–' + currentYear : '';
    })();
  </script>
</body>
</html>
